name: Weekly consultant memo

on:
  schedule:
    - cron: "17 13 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consult:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run consultant
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py consult
      - name: Heartbeat commit
        run: |
          git config user.name "stock-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "weekly consultant heartbeat [skip ci]" && git push)
